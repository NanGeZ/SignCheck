{

  "body_html": "<p style=\"margin:0 0 6px;text-align:center;\"><img src=\"assets/cover.png\" style=\"width:100%;display:block;\" /></p>\n<p style=\"margin:0 0 26px;text-align:center;font-size:12.5px;color:#9a9a9a;line-height:1.6;\">图：本文自制封面</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">昨天刷到一条视频。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">一个学学前教育的姑娘，去学校秋招会，手里一张简历都没打印。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">她走到每个展位，先把手机举起来：抖音 10 万粉，B 站 17 万粉。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">HR 不问四六级了，争着加她微信，开价 6000 到 8000。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">我本人还在上学，刷完这条，半天没缓过来。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">同一场秋招，有人抱着一沓证书没人理，有人亮一下手机，对面就把价报了。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#a84332;line-height:1.7;margin:40px 0;\">她凭的不是专业，<br />是被看见的能力。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:54px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:10px 0 30px;\">简历，早就换了副面孔</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 14px;text-align:left;letter-spacing:0.3px;\">以前的简历，拼的是这些：</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:6px 0 26px;\">\n<tr>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;background:#f7f2e9;font-size:14.5px;font-weight:bold;color:#7a6a4a;line-height:1.7;text-align:left;vertical-align:top;\">以前的简历</td>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;background:#f0e9db;font-size:14.5px;font-weight:bold;color:#7a6a4a;line-height:1.7;text-align:left;vertical-align:top;\">现在的简历</td>\n</tr>\n<tr>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">英语四六级</td>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">XX 平台账号 XX 万粉</td>\n</tr>\n<tr>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">几段实习经历</td>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">做过 XX 产品</td>\n</tr>\n<tr>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">在校任职 XX</td>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">手上有批真实用户</td>\n</tr>\n<tr>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#9a9a9a;line-height:1.7;text-align:left;vertical-align:top;\">—</td>\n<td style=\"width:50%;padding:11px 13px;border:1px solid #e5ded2;font-size:14.5px;color:#3f3f3f;line-height:1.7;text-align:left;vertical-align:top;\">会用 AI</td>\n</tr>\n</table>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">这不是段子，是正在发生的事。文凭还是那张文凭，但用人单位开始为「别的东西」付钱了。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:54px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:10px 0 30px;\">别把路走成一条</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">写这些不是劝你别学习、别考研、别考证。该过的关，一个都得过。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">是别把所有空闲，都押在同一条路上。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">课余顺手做点自媒体，就算最后没做起来，剪辑、表达、跟陌生人打交道，这些能力也实打实长在了你身上。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#a84332;line-height:1.7;margin:40px 0;\">账号可以黄，<br />本事不会。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:54px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:10px 0 30px;\">信息差，比你想的离谱得多</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">这个时代，信息差是真离谱。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">同一个学校、同一个专业，有人秋招前就摸清了哪些行业在招人、岗位到底要什么；有人直到散场，都没投出一份简历。差距不在智商，在<b style=\"color:#a84332;\">谁先知道</b>。</p>\n\n<p style=\"margin:0 0 8px;text-align:center;\"><img src=\"assets/flow.png\" style=\"width:100%;display:block;\" /></p>\n<p style=\"margin:0 0 26px;text-align:center;font-size:12.5px;color:#9a9a9a;line-height:1.6;\">图：用 AI 缩短信息差的四步</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">不会搜的，问它；看不懂的，让它讲人话；不知道从哪下手的，让它列步骤。以前要托关系、碰运气才问得到的信息，现在张嘴就有。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#a84332;line-height:1.7;margin:44px 0;\">AI，是普通人打破信息差的唯一途径。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:54px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:10px 0 30px;\">我自己，就是个失败样本</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">先交个底：我的自媒体没做成。抖音封过，B 站也封过，现在就剩公众号 2.9 万粉，也就一般般。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">但 AI 我用得还行。前段时间，我还反过来指导了我们专业课的老师。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">所以你看，路不止一条。走不通那条，不代表你就输了。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">那天看完视频，我就想说一句话：</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;line-height:1.7;margin:44px 0 18px;\">大学生们，<br />该清醒地认清现状了。</p>\n\n<p style=\"font-size:15.5px;line-height:1.85;color:#3f3f3f;margin:0 0 22px;text-align:left;letter-spacing:0.3px;\">文凭要考，路也别只留一条。工具就摆在那，用不用，随你。</p>\n"
}

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {

          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
